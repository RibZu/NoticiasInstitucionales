<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Arquitectura MVC manual de Noticias Institucionales</title>
      <desc id="architecture-desc">Diagrama de arquitectura que muestra el flujo Usuario → Vistas → Controladores → Modelos → MySQL/MariaDB, con panel.php accediendo a la base de datos de forma directa sin pasar por los modelos.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn before boxes) -->
      <!-- Usuario fan-out to vistas/*.php and panel.php (2 distinct attach points, 64px apart) -->
      <path d="M 448,96 V 112 Q 448,120 440,120 H 318 Q 310,120 310,128 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 512,96 V 112 Q 512,120 520,120 H 762 Q 770,120 770,128 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- vistas/*.php -> controladores/*.php (POST, link-blue: HTTP form submission) -->
      <line x1="310" y1="204" x2="310" y2="252" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- controladores/*.php -> modelos/*.php -->
      <line x1="310" y1="316" x2="310" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- modelos/*.php -> MySQL/MariaDB -->
      <line x1="310" y1="428" x2="310" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- panel.php -> MySQL/MariaDB (exceptional direct SQL access, bypasses modelos/*.php) -->
      <path d="M 770,204 V 500 Q 770,508 762,508 H 420" fill="none" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="320" y="222" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="231" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST</text>

      <rect x="780" y="346" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="814" y="355" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL DIRECTO</text>

      <!-- Node: Usuario / Navegador (input/actor) -->
      <rect x="380" y="40" width="200" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="40" width="200" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="388" y="46" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="404" y="55" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="480" y="72" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Usuario / Navegador</text>

      <!-- Node: vistas/*.php (5 collapsed views: login, alta, validar, admin, usuarios) -->
      <rect x="200" y="140" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="140" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="146" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="222" y="155" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VW</text>
      <text x="310" y="174" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">vistas/*.php</text>
      <text x="310" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">5 archivos</text>

      <!-- Node: panel.php (view with the direct-SQL exception, kept separate from vistas/*.php) -->
      <rect x="680" y="140" width="180" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="680" y="140" width="180" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="688" y="146" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="702" y="155" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VW</text>
      <text x="770" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">panel.php</text>

      <!-- Node: controladores/*.php (6 collapsed controllers) -->
      <rect x="200" y="252" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="252" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="258" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="222" y="267" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CT</text>
      <text x="310" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">controladores/*.php</text>
      <text x="310" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6 archivos</text>

      <!-- Node: modelos/*.php (4 collapsed models) -->
      <rect x="200" y="364" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="364" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="370" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="222" y="379" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MD</text>
      <text x="310" y="398" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">modelos/*.php</text>
      <text x="310" y="414" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">4 archivos</text>

      <!-- Node: MySQL / MariaDB (focal — the terminal every path converges on) -->
      <rect x="200" y="476" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="476" width="220" height="64" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="208" y="482" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="222" y="491" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="310" y="510" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MySQL / MariaDB</text>
      <text x="310" y="526" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">noticias_db</text>

      <!-- Legend strip (bottom 60px, 540-600) -->
      <line x1="40" y1="548" x2="920" y2="548" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="562" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="574" width="14" height="10" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Foco: BD</text>

      <rect x="170" y="574" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="190" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Componente PHP</text>

      <rect x="330" y="574" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="350" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Actor externo</text>

      <line x1="480" y1="579" x2="508" y2="579" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="516" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">POST (formulario)</text>

      <line x1="650" y1="579" x2="678" y2="579" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <text x="686" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Excepción SQL directo</text>

      <line x1="800" y1="579" x2="828" y2="579" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="836" y="583" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Llamada interna</text>
    </svg>