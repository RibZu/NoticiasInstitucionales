<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de datos · Noticias Institucionales</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Modelo de datos · Noticias Institucionales</p>
    <h1>Usuarios, Noticias, Historial y Configuración</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">Modelo de datos de Noticias Institucionales</title>
      <desc id="er-desc">Diagrama entidad-relación que muestra Usuarios como autores de Noticias, Noticias con su Historial de auditoría asociado, y una entidad Configuración sin relaciones declaradas en el esquema.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Relationship lines (drawn first, undirected per ER convention) -->
      <!-- USUARIOS 1 to N NOTICIAS (autor_id) -->
      <line x1="280" y1="160" x2="360" y2="160" stroke="#4f5d75" stroke-width="1"/>
      <!-- NOTICIAS 1 to N HISTORIAL (noticia_id) -->
      <line x1="680" y1="280" x2="720" y2="280" stroke="#4f5d75" stroke-width="1"/>

      <!-- Cardinality marks -->
      <rect x="286" y="152" width="12" height="12" fill="#f5f5f5"/>
      <text x="292" y="162" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="338" y="152" width="16" height="12" fill="#f5f5f5"/>
      <text x="346" y="162" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <rect x="686" y="272" width="12" height="12" fill="#f5f5f5"/>
      <text x="692" y="282" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

      <rect x="698" y="272" width="16" height="12" fill="#f5f5f5"/>
      <text x="706" y="282" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <!-- Entity: USUARIOS -->
      <rect x="40" y="120" width="240" height="200" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="40" y="120" width="240" height="40" rx="6" fill="rgba(45,49,66,0.04)"/>
      <rect x="40" y="152" width="240" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="40" y1="160" x2="280" y2="160" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="56" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="56" y="152" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">USUARIOS</text>
      <text x="56" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="264" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="56" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">nombre</text>
      <text x="264" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="56" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">email</text>
      <text x="264" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="56" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">clave</text>
      <text x="264" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar · bcrypt</text>
      <text x="56" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">es_editor</text>
      <text x="264" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tinyint</text>
      <text x="56" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">es_validador</text>
      <text x="264" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tinyint</text>
      <text x="56" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">es_admin</text>
      <text x="264" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">tinyint</text>

      <!-- Entity: NOTICIAS (focal — aggregate root) -->
      <rect x="360" y="80" width="320" height="240" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="360" y="80" width="320" height="40" rx="6" fill="rgba(235,108,54,0.10)"/>
      <rect x="360" y="112" width="320" height="8" fill="rgba(235,108,54,0.10)"/>
      <line x1="360" y1="120" x2="680" y2="120" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
      <text x="376" y="96" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · RAÍZ AGREGADO</text>
      <text x="376" y="112" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">NOTICIAS</text>
      <text x="376" y="140" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="664" y="140" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="376" y="160" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">titulo</text>
      <text x="664" y="160" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="376" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">descripcion</text>
      <text x="664" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
      <text x="376" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">imagen</text>
      <text x="664" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="376" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">estado</text>
      <text x="664" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar · enum</text>
      <text x="376" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">comentario_correccion</text>
      <text x="664" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="376" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_creacion</text>
      <text x="664" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>
      <text x="376" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_publicacion</text>
      <text x="664" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>
      <text x="376" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ autor_id</text>
      <text x="664" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>

      <!-- Entity: HISTORIAL -->
      <rect x="720" y="160" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="720" y="160" width="200" height="40" rx="6" fill="rgba(45,49,66,0.04)"/>
      <rect x="720" y="192" width="200" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="720" y1="200" x2="920" y2="200" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="736" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="736" y="192" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">HISTORIAL</text>
      <text x="736" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="904" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="736" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">→ noticia_id</text>
      <text x="904" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="736" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">nombre_usuario</text>
      <text x="904" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="736" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">accion_realizada</text>
      <text x="904" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">varchar</text>
      <text x="736" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">fecha_hora</text>
      <text x="904" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">datetime</text>

      <!-- Entity: CONFIGURACION (standalone — no FK relationship declared in the source schema) -->
      <rect x="370" y="380" width="220" height="120" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="370" y="380" width="220" height="40" rx="6" fill="rgba(45,49,66,0.04)"/>
      <rect x="370" y="412" width="220" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="370" y1="420" x2="590" y2="420" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="386" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
      <text x="386" y="412" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">CONFIGURACION</text>
      <text x="386" y="440" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="574" y="440" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="386" y="460" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">dias_expiracion</text>
      <text x="574" y="460" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>
      <text x="386" y="480" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">max_peso_imagen</text>
      <text x="574" y="480" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">int</text>

      <!-- Legend strip (bottom 60px, 540-600) -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="538" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="550" width="14" height="10" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Raíz del agregado</text>

      <rect x="220" y="550" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="240" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entidad</text>

      <text x="360" y="559" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
      <text x="376" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clave primaria</text>

      <text x="520" y="559" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
      <text x="536" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Clave foránea</text>

      <text x="680" y="559" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
      <text x="712" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cardinalidad</text>
    </svg>
  </div>
</body>
</html>
